apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: monerometrics
  labels:
    app: api
    app.kubernetes.io/part-of: monerometrics
spec:
  replicas: 1
  # Le nouveau pod doit etre pret avant que l'ancien ne s'arrete : avec
  # Recreate, chaque deploiement coupait l'API quelques secondes, et le proxy
  # repondait 503 sans en-tetes CORS.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
        vault.hashicorp.com/role: "monerometrics-api"
        vault.hashicorp.com/agent-inject-secret-postgres-credentials: "secret/data/postgres/credentials"
        vault.hashicorp.com/agent-inject-template-postgres-credentials: |
          {{- with secret "secret/data/postgres/credentials" -}}
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
          {{- end }}
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/nowi333/monerometrics-api:0.29.4
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RATE_LIMIT_PER_MIN
              value: "300"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: postgres-credentials-fallback
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Le pod qui s'arrete continue de servir dix secondes, le temps que
          # Traefik le retire de sa rotation : sans ce delai, les requetes en
          # vol pendant la bascule recevaient un 502.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
