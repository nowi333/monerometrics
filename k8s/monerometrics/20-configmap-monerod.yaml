---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monerod-config
  namespace: monerometrics
data:
  monerod.conf: |
    data-dir=/data
    prune-blockchain=1
    # 18081 : RPC restreint, pour l'API et le worker.
    # 18083 : RPC complet, que la NetworkPolicy reserve au worker. Il donne acces
    # aux chaines alternatives, sans lesquelles la plupart des orphelins
    # passent inapercus.
    rpc-bind-ip=0.0.0.0
    rpc-bind-port=18083
    rpc-restricted-bind-ip=0.0.0.0
    rpc-restricted-bind-port=18081
    confirm-external-bind=1
    p2p-bind-ip=0.0.0.0
    p2p-bind-port=18080
    # Sans cette option, monerod oublie ses blocs alternatifs a chaque
    # redemarrage : ce sont precisement les orphelins qu'on mesure.
    keep-alt-blocks=1
    no-igd=1
    no-zmq=1
    log-level=0
    log-file=/data/monerod.log
    max-log-file-size=104857600
    max-log-files=3
    fast-block-sync=1
    max-concurrency=4
    db-sync-mode=safe
    sync-pruned-blocks=1
    block-sync-size=100
    out-peers=32
