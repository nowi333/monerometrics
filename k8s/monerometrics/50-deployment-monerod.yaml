---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monerod
  namespace: monerometrics
  labels:
    app: monerod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monerod
  template:
    metadata:
      labels:
        app: monerod
    spec:
      # 30 s (defaut) peut ne pas suffire a vider les 250 Mo d'ecritures
      # differees de db-sync-mode=fast:async avant le SIGKILL.
      terminationGracePeriodSeconds: 180
      containers:
        - name: monerod
          image: sethsimmons/simple-monerod:v0.18.3.4
          args:
            - --config-file=/etc/monero/monerod.conf
          ports:
            - containerPort: 18081
              name: rpc
            - containerPort: 18080
              name: p2p
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/monero
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 3000m
              # 3Gi et non 5Gi : la consommation reelle est de 1,2Gi, la marge
              # reste superieure a 150 %, et la somme des limites du noeud
              # repasse sous sa capacite physique. Au-dela, le noyau pouvait
              # tuer arbitrairement un conteneur en cas de pic simultane.
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /get_info
              port: 18081
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 18081
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: monerod-data
        - name: config
          configMap:
            name: monerod-config
