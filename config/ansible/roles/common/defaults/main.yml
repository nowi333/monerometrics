---

common_ssh_port: 22
# Plage CGNAT de Tailscale. Sur un serveur neuf, Tailscale doit etre joint
# avant le premier passage, sinon cette regle coupe l'acces SSH.
common_ssh_allowed_sources:
  - 100.64.0.0/10
common_ssh_permit_root_login: "no"
common_ssh_password_authentication: "no"
common_ssh_max_auth_tries: 4
common_ssh_client_alive_interval: 600
common_ssh_client_alive_count_max: 3
common_ssh_login_grace_time: 60

common_packages: []

common_fail2ban_ssh_maxretry: 5
common_fail2ban_ssh_findtime: 600
common_fail2ban_ssh_bantime: 600

common_sysctl_hardening: []

# Mise a jour complete des paquets a chaque passage (dist-upgrade).
common_apt_upgrade: true

# Compte d'administration (SSH par cle via Tailscale, sudo sans mot de passe).
common_admin_user: ops
common_admin_pubkey_file: ~/.ssh/monerometrics/bastion.pub
