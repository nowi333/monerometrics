---

- name: Configure edge (hardening CIS L1 + Tailscale + nginx + Tor + TLS + WAF ModSecurity)
  hosts: edge
  gather_facts: true
  become: false
  roles:
    - common
    - tailscale
    - nginx
    - tor
    - letsencrypt
    - modsecurity

- name: Configure k3s (hardening CIS L1 + Tailscale + data disk + Kubernetes single-node)
  hosts: k3s
  gather_facts: true
  become: false
  roles:
    - common
    - tailscale
    - data_disk
    - k3s
