<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none"
     stroke="#ff6600" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="round">

  <!-- Les traits s'arretent dans l'epaisseur du contour, jamais au-dela : ils
       comblent la jonction sans jamais entrer dans le vide du bloc.
       Extremites plates pour la meme raison, une extremite arrondie depassait. -->
  <path d="M27 50 H39"/>
  <path d="M61 50 H73"/>
  <path d="M145 24 H157"/>
  <path d="M145 76 H157"/>

  <!-- La bifurcation part et arrive a l'horizontale : la courbe epouse les blocs
       au lieu de les aborder en biais. -->
  <path d="M95 50 C107 50 109 24 123 24"/>
  <path d="M95 50 C107 50 109 76 123 76"/>

  <rect x="6" y="40" width="20" height="20" rx="4"/>
  <rect x="40" y="40" width="20" height="20" rx="4"/>
  <rect x="74" y="40" width="20" height="20" rx="4"/>
  <rect x="124" y="14" width="20" height="20" rx="4"/>
  <rect x="158" y="14" width="20" height="20" rx="4"/>
  <rect x="124" y="66" width="20" height="20" rx="4"/>
  <rect x="158" y="66" width="20" height="20" rx="4"/>
</svg>
