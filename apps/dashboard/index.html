      <main>
        <h1>monerometrics — Monero network metrics</h1>
        <p>
          monerometrics is a free, reorg-aware observatory of the Monero (XMR) network.
          It measures and historizes chain reorganizations (reorgs), orphan blocks,
          network hashrate, block time, mempool state, and mining-pool distribution,
          including centralization metrics such as the largest-pool share and the
          Nakamoto coefficient. An interactive chain fork visualizer shows the canonical
          chain and competing orphan blocks in real time, and every metric is also
          available through a free public API.
        </p>
        <p>
          Observatoire libre du réseau Monero : métriques en temps réel, détection des
          réorganisations de chaîne (reorg), blocs orphelins, hashrate du réseau, temps
          de bloc, mempool, distribution des pools de minage et coefficient de Nakamoto,
          avec un visualiseur de forks de la chaîne et une API publique.
        </p>
        <ul>
          <li><a href="https://monerometrics.net/">Monero metrics dashboard</a></li>
          <li><a href="https://api.monerometrics.net/">Public Monero metrics API</a></li>
        </ul>

        <section>
          <h2>Key definitions</h2>
          <dl>
            <dt>Chain reorganization (reorg)</dt>
            <dd>When the Monero network replaces one or more recent blocks with a competing branch that becomes canonical. monerometrics detects reorgs by re-checking a rolling window of recent blocks against its own node and records the fork point, depth and affected transactions.</dd>
            <dt>Orphan block</dt>
            <dd>A valid block that was mined but is not part of the final canonical chain, because a competing block at the same height won.</dd>
            <dt>Nakamoto coefficient</dt>
            <dd>The minimum number of mining pools that together produce more than 50% of blocks. A lower value means more mining centralization.</dd>
            <dt>Mining-pool attribution</dt>
            <dd>Verified, not guessed: where a pool publishes its wallet view key, the coinbase output is checked cryptographically (view-key proof), and cross-checked against pools' public block lists. Unmatched blocks are reported as unknown.</dd>
          </dl>
        </section>

        <section>
          <h2>FAQ</h2>
          <h3>What is monerometrics?</h3>
          <p>A free, reorg-aware observatory of the Monero (XMR) network. It runs its own Monero node, indexes every block, and tracks reorganizations, orphan blocks, hashrate, block time, mempool and mining-pool distribution, with a public read-only API and no tracking.</p>
          <h3>Can I explore the whole Monero chain and search old blocks?</h3>
          <p>Yes. The interactive chain fork visualizer lets you search any block height or block hash and jump straight to it, all the way down to the genesis block, with lazy loading so it stays fast.</p>
          <h3>How does monerometrics attribute blocks to mining pools?</h3>
          <p>Attribution is verified, not guessed. Where a pool publishes its view key, the coinbase output is checked cryptographically (view-key proof), and cross-checked against pools' public block lists. Blocks matching no known pool are reported as unknown.</p>
          <h3>Is the API free?</h3>
          <p>Yes: free, public, read-only, no account, no API key, no rate-limit tiers, no tracking, no ads. A machine-readable OpenAPI schema is available at api.monerometrics.net/openapi.json.</p>
        </section>
