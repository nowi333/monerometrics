version: 2
updates:
  - package-ecosystem: pip
    directories: ["/apps/api", "/apps/worker", "/apps/mcp"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
