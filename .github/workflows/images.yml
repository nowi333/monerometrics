name: images

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/api/**'
      - 'apps/mcp/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: worker
            imports: indexer, pool_proofs, pools, haveno, retro_pools
          - app: api
            imports: main
          - app: mcp
            imports: server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image (validation, no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: false
          load: true
          tags: mm-${{ matrix.app }}:ci

      # Une image qui se construit peut encore planter au demarrage sur un
      # import casse : on charge chaque module comme le ferait le conteneur.
      - name: Import check
        run: docker run --rm mm-${{ matrix.app }}:ci python -c "import ${{ matrix.imports }}"

      - name: Dependency audit
        run: |
          pip install --quiet pip-audit
          pip-audit -r apps/${{ matrix.app }}/requirements.txt
